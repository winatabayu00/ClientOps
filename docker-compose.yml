services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clientops}
      POSTGRES_USER: ${POSTGRES_USER:-clientops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clientops_dev}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-clientops_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-replace-with-a-long-random-minio-secret}
    ports: ["9000:9000", "9001:9001"]

  api:
    build: ./backend
    environment:
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-clientops}:${POSTGRES_PASSWORD:-clientops_dev}@postgres:5432/${POSTGRES_DB:-clientops}?sslmode=disable
      ACCESS_TOKEN_KEY: ${ACCESS_TOKEN_KEY:?ACCESS_TOKEN_KEY is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4.18.2
    profiles: ["tools"]
    volumes: ["./backend/migrations:/migrations:ro"]
    entrypoint: ["migrate"]
    command: ["-path=/migrations", "-database=postgres://${POSTGRES_USER:-clientops}:${POSTGRES_PASSWORD:-clientops_dev}@postgres:5432/${POSTGRES_DB:-clientops}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: ./backend
    profiles: ["tools"]
    command: ["/seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clientops}:${POSTGRES_PASSWORD:-clientops_dev}@postgres:5432/${POSTGRES_DB:-clientops}?sslmode=disable
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
    depends_on:
      postgres:
        condition: service_healthy
