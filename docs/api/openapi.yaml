    Sort: { name: sort, in: query, schema: { type: string } }
    Order: { name: order, in: query, schema: { type: string } }
    ClientID: { name: client_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
    OwnerID: { name: owner_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
    OpsOwnerID: { name: ops_owner_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
    ReleaseID: { name: release_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
    AssigneeID: { name: assignee_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
    ReporterID: { name: reporter_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
    ClientStatus: { name: status, in: query, schema: { type: string, enum: [ACTIVE, ONBOARDING, INACTIVE] } }
    ClientType: { name: type, in: query, schema: { $ref: '#/components/schemas/ClientType' } }
