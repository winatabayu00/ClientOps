    Notification: { type: object, properties: { id: { $ref: '#/components/schemas/UUID' }, type: { type: string }, title: { type: string }, message: { type: string }, entity_type: { type: string, nullable: true }, entity_id: { $ref: '#/components/schemas/UUID', nullable: true }, read_at: { $ref: '#/components/schemas/DateTime', nullable: true }, created_at: { $ref: '#/components/schemas/DateTime' } } }
