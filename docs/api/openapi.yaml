openapi: 3.0.3
info:
  title: ClientOps API
  version: 1.0.0
  description: |
    Implemented ClientOps REST API. Base path: `/api/v1`.

    Authentication uses HttpOnly access and refresh cookies. Obtain the readable `clientops_csrf` cookie with `GET /auth/csrf`; send its exact value in `X-CSRF-Token` on every state-changing request, including login and refresh. Cookies are issued by login/refresh and must be sent with requests. Cookie names are deployment-configurable; `clientops_access` and `clientops_refresh` are the defaults used here. The refresh cookie is scoped to `/api/v1/auth`.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Clients
  - name: Issues
  - name: Releases
  - name: Handoffs
  - name: Follow-ups
  - name: Feature Requests
  - name: Users
  - name: Roles
  - name: Permissions
  - name: Dashboard
  - name: Notifications
paths:
  /notifications:
    get:
      tags: [Notifications]
      summary: List current user's notifications
      description: Filters: `read` (`true` or `false`), `page`, `limit` (maximum 100).
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/NotificationListSuccess' }, '401': { $ref: '#/components/responses/AuthenticationError' } }
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get current user's unread notification count
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/UnreadNotificationCountSuccess' }, '401': { $ref: '#/components/responses/AuthenticationError' } }
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark current user's notification as read
      security: [{ AccessCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ResourceNotFound' } }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all current user's notifications as read
      security: [{ AccessCookie: [], CSRFToken: [] }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' } }
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Requires `user.manage`. Filters: `search`, `status` (`ACTIVE` or `INACTIVE`), `role`, `page`, `limit`.
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/UserListSuccess' }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/PermissionError' }, '422': { $ref: '#/components/responses/ValidationError' } }
    post:
      tags: [Users]
      summary: Create user
      description: Requires `user.manage`. Passwords use Argon2id; minimum 12 characters.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/UserSuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Users]
      summary: Get user
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/UserSuccess' }, '403': { $ref: '#/components/responses/PermissionError' }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
    patch:
      tags: [Users]
      summary: Update user name or status
      description: Requires `user.manage`. The caller cannot deactivate themselves.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUserRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/UserSuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /users/{id}/roles:
    put:
      tags: [Users]
      summary: Replace user roles
      description: Requires `user.manage`. A caller cannot replace their own roles.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleIDsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /roles:
    get:
      tags: [Roles]
      summary: List roles with permissions
      description: Requires `role.manage`.
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/RoleListSuccess' }, '403': { $ref: '#/components/responses/PermissionError' } }
    post:
      tags: [Roles]
      summary: Create role
      description: Requires `role.manage`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/RoleSuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /roles/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Roles]
      summary: Get role
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/RoleSuccess' }, '403': { $ref: '#/components/responses/PermissionError' }, '404': { $ref: '#/components/responses/ResourceNotFound' } }
    patch:
      tags: [Roles]
      summary: Update role
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/RoleSuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Roles]
      summary: Delete unused role
      description: Requires `role.manage`. Roles assigned to users cannot be deleted.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      responses: { '204': { description: Role deleted. }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /permissions:
    get:
      tags: [Permissions]
      summary: List system-defined permissions
      description: Requires `role.manage`.
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/PermissionListSuccess' }, '403': { $ref: '#/components/responses/PermissionError' } }
  /auth/csrf:
    get:
      tags: [Auth]
      summary: Issue CSRF cookie
      security: []
      responses:
        '200': { $ref: '#/components/responses/CSRFIssued' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and issue auth cookies
      security: [{ CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/LoginSuccess' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue new auth cookies
      security: [{ RefreshCookie: [], CSRFToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/RefreshSuccess' }
        '401': { $ref: '#/components/responses/InvalidRefreshToken' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear auth cookies; revoke session when refresh cookie is present
      security: [{ CSRFToken: [] }]
      responses:
        '204': { description: Logged out. Auth cookies cleared. }
        '403': { $ref: '#/components/responses/CSRFError' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security: [{ AccessCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/UserSuccess' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
  /clients:
    get:
      tags: [Clients]
      summary: List accessible clients
      description: Requires `client.read`. `OPS_STAFF` sees only assigned clients.
      security: [{ AccessCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/ClientStatus' }, { $ref: '#/components/parameters/ClientType' }, { $ref: '#/components/parameters/OwnerID' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses: { '200': { $ref: '#/components/responses/ClientListSuccess' }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/PermissionError' }, '500': { $ref: '#/components/responses/InternalError' } }
    post:
      tags: [Clients]
      summary: Create client
      description: Requires `client.create`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateClientRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/ClientCreated' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /clients/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Clients]
      summary: Get client
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/ClientSuccess' }, '403': { $ref: '#/components/responses/PermissionError' }, '404': { $ref: '#/components/responses/ClientNotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
    patch:
      tags: [Clients]
      summary: Update client
      description: Requires `client.update`. `version` implements optimistic locking.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateClientRequest' } } } }
       responses: { '200': { $ref: '#/components/responses/ClientUpdated' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ClientNotFound' }, '409': { $ref: '#/components/responses/VersionConflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /clients/{id}/timeline:
    get:
      tags: [Clients]
      summary: List derived client activity
      description: Requires `client.read`. Events are derived from persisted issue, release impact, handoff, and follow-up records. `OPS_STAFF` sees only assigned clients.
      security: [{ AccessCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { name: type, in: query, schema: { type: string, enum: [ISSUE_REPORTED, ISSUE_STATUS_CHANGED, RELEASE_IMPACT_IDENTIFIED, HANDOFF_CREATED, HANDOFF_ACKNOWLEDGED, HANDOFF_COMPLETED, FOLLOW_UP_CREATED, FOLLOW_UP_COMPLETED] } }, { name: from, in: query, schema: { type: string, format: date-time } }, { name: to, in: query, schema: { type: string, format: date-time } }]
      responses: { '200': { description: Timeline events }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/PermissionError' }, '404': { $ref: '#/components/responses/ClientNotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Get scoped operational overview
      description: Requires `client.read`. `open` excludes CLOSED and CANCELLED issues; `critical` is open issues with CRITICAL severity; `pending` follow-ups are OPEN or IN_PROGRESS; `overdue` pending follow-ups have `due_at` before request time; pending handoffs have status PENDING. `OPS_STAFF` metrics include assigned clients only. SLA and client-health metrics are unavailable because current tables do not persist their inputs.
      security: [{ AccessCookie: [] }]
      responses: { '200': { description: Scoped overview }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/PermissionError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /clients/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      tags: [Clients]
      summary: Archive client
      description: Requires `client.archive`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } } }
      responses: { '204': { description: Client archived. }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ClientNotFound' }, '409': { $ref: '#/components/responses/VersionConflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /clients/{id}/owners:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Clients]
      summary: List client owners
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/OwnerListSuccess' }, '403': { $ref: '#/components/responses/PermissionError' }, '404': { $ref: '#/components/responses/ClientNotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
    post:
      tags: [Clients]
      summary: Assign client owner
      description: Requires `client.assign_owner`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddOwnerRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/EmptyCreated' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ClientNotFound' }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /clients/{id}/change-primary-owner:
    post:
      tags: [Clients]
      summary: Change primary owner
      description: Requires `client.assign_owner`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePrimaryOwnerRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ClientNotFound' }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /clients/{id}/contacts:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Clients]
      summary: List client contacts
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/ContactListSuccess' }, '403': { $ref: '#/components/responses/PermissionError' }, '404': { $ref: '#/components/responses/ClientNotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
    post:
      tags: [Clients]
      summary: Add client contact
      description: Requires `client.update`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateContactRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/ContactCreated' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ClientNotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /issues:
    get:
      tags: [Issues]
      summary: List accessible issues
      security: [{ AccessCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/ClientID' }, { $ref: '#/components/parameters/IssueStatus' }, { $ref: '#/components/parameters/Severity' }, { $ref: '#/components/parameters/Category' }, { $ref: '#/components/parameters/AssigneeID' }, { $ref: '#/components/parameters/ReporterID' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses: { '200': { $ref: '#/components/responses/IssueListSuccess' }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/PermissionError' }, '500': { $ref: '#/components/responses/InternalError' } }
    post:
      tags: [Issues]
      summary: Create issue
      description: Requires `issue.create`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateIssueRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/IssueCreated' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /issues/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Issues]
      summary: Get issue
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/IssueSuccess' }, '403': { $ref: '#/components/responses/PermissionError' }, '404': { $ref: '#/components/responses/IssueNotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
    patch:
      tags: [Issues]
      summary: Update issue attributes
      description: Requires `issue.update`. Does not change workflow status.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateIssueRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/IssueUpdated' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/IssueNotFound' }, '409': { $ref: '#/components/responses/IssueConflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /issues/{id}/history:
    get:
      tags: [Issues]
      summary: List issue status history
      security: [{ AccessCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { $ref: '#/components/responses/HistoryListSuccess' }, '403': { $ref: '#/components/responses/PermissionError' }, '404': { $ref: '#/components/responses/IssueNotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /issues/{id}/triage: { $ref: '#/components/x-pathItems/IssueTriage' }
  /issues/{id}/assign: { $ref: '#/components/x-pathItems/IssueAssign' }
  /issues/{id}/start-investigation: { $ref: '#/components/x-pathItems/IssueStartInvestigation' }
  /issues/{id}/start-development: { $ref: '#/components/x-pathItems/IssueStartDevelopment' }
  /issues/{id}/mark-qa: { $ref: '#/components/x-pathItems/IssueMarkQA' }
  /issues/{id}/qa-failed: { $ref: '#/components/x-pathItems/IssueQAFailed' }
  /issues/{id}/mark-released: { $ref: '#/components/x-pathItems/IssueMarkReleased' }
  /issues/{id}/start-follow-up: { $ref: '#/components/x-pathItems/IssueStartFollowUp' }
  /issues/{id}/close: { $ref: '#/components/x-pathItems/IssueClose' }
  /issues/{id}/reopen: { $ref: '#/components/x-pathItems/IssueReopen' }
  /releases:
    get:
      tags: [Releases]
      summary: List releases
      security: [{ AccessCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/ReleaseListSuccess' }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/PermissionError' }, '500': { $ref: '#/components/responses/InternalError' } }
    post:
      tags: [Releases]
      summary: Create release
      description: Requires `release.create`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReleaseRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/ReleaseCreated' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /releases/{id}:
    get:
      tags: [Releases]
      summary: Get release detail
      security: [{ AccessCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { $ref: '#/components/responses/ReleaseDetailSuccess' }, '403': { $ref: '#/components/responses/PermissionError' }, '404': { $ref: '#/components/responses/ReleaseNotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
  /releases/{id}/items:
    post:
      tags: [Releases]
      summary: Add release item
      description: Requires `release.update`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReleaseItemRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/ReleaseItemCreated' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ReleaseNotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /releases/{id}/impacts:
    post:
      tags: [Releases]
      summary: Replace release impacts
      description: Requires `release.manage_impact`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetImpactsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ReleaseNotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /releases/{id}/ready:
    post:
      tags: [Releases]
      summary: Mark release ready
      description: Requires `release.update`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { $ref: '#/components/responses/ReleaseSuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ReleaseNotFound' }, '409': { $ref: '#/components/responses/ReleaseConflict' }, '500': { $ref: '#/components/responses/InternalError' } }
  /releases/{id}/publish:
    post:
      tags: [Releases]
      summary: Publish release and generate handoffs
      description: Requires `release.publish`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { $ref: '#/components/responses/ReleasePublished' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ReleaseNotFound' }, '409': { $ref: '#/components/responses/ReleaseConflict' }, '500': { $ref: '#/components/responses/InternalError' } }
  /documentation:
    get:
      tags: [Documentation]
      summary: List documentation
      description: Requires `documentation.read`.
      security: [{ AccessCookie: [] }]
      responses: { '200': { description: Documentation list. }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/PermissionError' }, '500': { $ref: '#/components/responses/InternalError' } }
    post:
      tags: [Documentation]
      summary: Create documentation draft
      description: Requires `documentation.create`.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentationRequest' } } } }
      responses: { '201': { description: Documentation draft created. }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /documentation/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Documentation]
      summary: Get documentation
      security: [{ AccessCookie: [] }]
      responses: { '200': { description: Documentation detail. }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '403': { $ref: '#/components/responses/PermissionError' } }
    patch:
      tags: [Documentation]
      summary: Edit documentation draft
      description: Requires `documentation.update`. Only `DRAFT`; `version` prevents stale writes.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/DocumentationRequest' }, { $ref: '#/components/schemas/VersionRequest' }] } } } }
      responses: { '200': { description: Documentation updated. }, '409': { description: Invalid state or stale version. }, '422': { $ref: '#/components/responses/ValidationError' } }
  /documentation/{id}/{action}:
    post:
      tags: [Documentation]
      summary: Documentation lifecycle action
      description: 'Actions: `submit-review` requires `documentation.review` from `DRAFT`; `publish` requires `documentation.publish` from `IN_REVIEW`; `archive` requires `documentation.archive`. All require `version`.'
      security: [{ AccessCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { name: action, in: path, required: true, schema: { type: string, enum: [submit-review, publish, archive] } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } } }
      responses: { '200': { description: Documentation transitioned. }, '409': { description: Invalid state or stale version. }, '422': { $ref: '#/components/responses/ValidationError' } }
  /documentation/{id}/releases:
    post:
      tags: [Documentation]
      summary: Link documentation to release
      description: Requires `documentation.update`. Published linked documentation satisfies handoff completion's documentation requirement.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [release_id], properties: { release_id: { type: string, format: uuid } } } } } }
      responses: { '200': { description: Release linked. }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /handoffs:
    get:
      tags: [Handoffs]
      summary: List handoffs
      description: Requires `release.read`. Non-managers are restricted to their own handoffs; supplied `ops_owner_id` is ignored.
      security: [{ AccessCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientID' }, { $ref: '#/components/parameters/ReleaseID' }, { $ref: '#/components/parameters/OpsOwnerID' }, { $ref: '#/components/parameters/HandoffStatus' }]
      responses: { '200': { $ref: '#/components/responses/HandoffListSuccess' }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/PermissionError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /handoffs/{id}:
    get:
      tags: [Handoffs]
      summary: Get handoff
      security: [{ AccessCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { $ref: '#/components/responses/HandoffSuccess' }, '403': { $ref: '#/components/responses/AccessError' }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
  /handoffs/{id}/acknowledge: { $ref: '#/components/x-pathItems/HandoffAcknowledge' }
  /handoffs/{id}/complete: { $ref: '#/components/x-pathItems/HandoffComplete' }
  /follow-ups:
    get:
      tags: [Follow-ups]
      summary: List follow-ups
      description: Requires `client_followup.create`. Non-managers are restricted to their own records; supplied `owner_id` is ignored.
      security: [{ AccessCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientID' }, { $ref: '#/components/parameters/OwnerID' }, { $ref: '#/components/parameters/FollowUpStatus' }]
      responses: { '200': { $ref: '#/components/responses/FollowUpListSuccess' }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/PermissionError' }, '500': { $ref: '#/components/responses/InternalError' } }
    post:
      tags: [Follow-ups]
      summary: Create follow-up
      description: Requires `client_followup.create`. Non-managers may create only for themselves.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateFollowUpRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/FollowUpCreated' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /follow-ups/{id}/start: { $ref: '#/components/x-pathItems/FollowUpStart' }
  /follow-ups/{id}/complete: { $ref: '#/components/x-pathItems/FollowUpComplete' }
  /feature-requests:
    get:
      tags: [Feature Requests]
      summary: List accessible feature demand
      description: Requires `feature_request.read`. `OPS_STAFF` sees requests linked to owned clients. Supports `search`, `status`, `priority`, `client_id`, `product_owner_id`, `page`, `limit`.
      security: [{ AccessCookie: [] }]
      responses: { '200': { description: Paginated feature requests with demand counts available from detail. }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/PermissionError' } }
    post:
      tags: [Feature Requests]
      summary: Create feature demand
      description: Requires `feature_request.create`. Creates one capability request plus its initial client demand.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [client_id, title, problem_statement, expected_outcome], properties: { client_id: { type: string, format: uuid }, title: { type: string }, problem_statement: { type: string }, expected_outcome: { type: string } } } } } }
      responses: { '201': { description: Feature request created. }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /feature-requests/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Feature Requests]
      summary: Get feature request demand detail
      description: Includes requesting clients, `client_count`, and `oldest_request_at`.
      security: [{ AccessCookie: [] }]
      responses: { '200': { description: Feature request demand detail. }, '404': { description: Feature request unavailable. }, '422': { $ref: '#/components/responses/ValidationError' } }
  /feature-requests/{id}/add-client:
    post:
      tags: [Feature Requests]
      summary: Add client demand
      description: Requires `feature_request.create`. Rejects duplicate client demand.
      security: [{ AccessCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [client_id], properties: { client_id: { type: string, format: uuid }, client_context: { type: string } } } } } }
      responses: { '201': { description: Client demand added. }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /feature-requests/{id}/{action}:
    post:
      tags: [Feature Requests]
      summary: Transition feature request
      description: 'Explicit actions: `start-review`, `accept`, `reject`, `mark-planned`, `start-development`, `mark-released`, `mark-delivered`, `mark-duplicate`. Requires the action permission. All actions require `version`; reject requires `reason`; mark-duplicate requires `original_request_id`.'
      security: [{ AccessCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { name: action, in: path, required: true, schema: { type: string, enum: [start-review, accept, reject, mark-planned, start-development, mark-released, mark-delivered, mark-duplicate] } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 }, reason: { type: string }, original_request_id: { type: string, format: uuid } } } } } }
      responses: { '200': { description: Feature request transitioned. }, '409': { description: 'Invalid transition, stale version, or duplicate demand.' }, '422': { $ref: '#/components/responses/ValidationError' } }
components:
  x-pathItems:
    IssueTriage: &issue_action { post: &issue_post { tags: [Issues], summary: Issue workflow action, description: 'Requires route-specific issue permission and `version`. `mark-released` requires `release_id`; `reopen` requires `reason`.', security: [{ AccessCookie: [], CSRFToken: [] }], parameters: [{ $ref: '#/components/parameters/ID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IssueActionRequest' } } } }, responses: { '200': { $ref: '#/components/responses/IssueUpdated' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/IssueNotFound' }, '409': { $ref: '#/components/responses/IssueConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } } } }
    IssueAssign: { post: *issue_post }
    IssueStartInvestigation: { post: *issue_post }
    IssueStartDevelopment: { post: *issue_post }
    IssueMarkQA: { post: *issue_post }
    IssueQAFailed: { post: *issue_post }
    IssueMarkReleased: { post: *issue_post }
    IssueStartFollowUp: { post: *issue_post }
    IssueClose: { post: *issue_post }
    IssueReopen: { post: *issue_post }
    HandoffAcknowledge: &handoff_action { post: &handoff_post { tags: [Handoffs], summary: Handoff workflow action, description: 'Requires `issue.follow_up`. Assigned owner or `SUPER_ADMIN`/`OPS_MANAGER` only. Completion requires published documentation and completed required follow-up.', security: [{ AccessCookie: [], CSRFToken: [] }], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '200': { $ref: '#/components/responses/HandoffSuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '409': { $ref: '#/components/responses/HandoffConflict' }, '500': { $ref: '#/components/responses/InternalError' } } } }
    HandoffComplete: { post: *handoff_post }
    FollowUpStart: { post: { tags: [Follow-ups], summary: Start follow-up, description: 'Requires `client_followup.create`. Owner or manager only.', security: [{ AccessCookie: [], CSRFToken: [] }], parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '200': { $ref: '#/components/responses/FollowUpSuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '409': { $ref: '#/components/responses/OperationConflict' }, '500': { $ref: '#/components/responses/InternalError' } } } }
    FollowUpComplete: { post: { tags: [Follow-ups], summary: Complete follow-up, description: 'Requires `client_followup.complete`. Owner or manager only.', security: [{ AccessCookie: [], CSRFToken: [] }], parameters: [{ $ref: '#/components/parameters/ID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteFollowUpRequest' } } } }, responses: { '200': { $ref: '#/components/responses/FollowUpSuccess' }, '403': { $ref: '#/components/responses/PermissionOrCSRFError' }, '404': { $ref: '#/components/responses/ResourceNotFound' }, '409': { $ref: '#/components/responses/OperationConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } } } }
  securitySchemes:
    AccessCookie: { type: apiKey, in: cookie, name: clientops_access, description: HttpOnly access-token cookie; actual name is server-configurable. }
    RefreshCookie: { type: apiKey, in: cookie, name: clientops_refresh, description: HttpOnly refresh-token cookie; actual name is server-configurable. }
    CSRFToken: { type: apiKey, in: header, name: X-CSRF-Token, description: Exact value of readable `clientops_csrf` cookie. }
